{% extends 'base.html' %}

{% block content %}

<style>
    .auth-container {
        min-height: 85vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px;
    }

    .auth-card {
        width: 100%;
        max-width: 550px;
        background: rgba(17, 24, 39, 0.9);
        padding: 50px;
        border-radius: 24px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        backdrop-filter: blur(12px);
    }

    .auth-title {
        font-size: 46px;
        font-weight: bold;
        text-align: center;
        margin-bottom: 15px;
    }

    .auth-subtitle {
        text-align: center;
        color: #b0b0d0;
        margin-bottom: 35px;
        font-size: 18px;
    }

    .auth-input {
        width: 100%;
        padding: 16px;
        margin-bottom: 18px;
        border-radius: 14px;
        border: none;
        background: #1f2937;
        color: white;
        font-size: 16px;
        box-sizing: border-box;
    }

    .auth-btn {
        width: 100%;
        padding: 16px;
        background: linear-gradient(135deg,#7c5cff,#5a38ff);
        border: none;
        border-radius: 14px;
        color: white;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
    }

    .message {
        padding: 15px;
        margin-bottom: 20px;
        border-radius: 12px;
        text-align: center;
    }

    .success {
        background: #16a34a;
    }

    .error {
        background: #dc2626;
    }

    .auth-link {
        text-align: center;
        margin-top: 25px;
        color: #b0b0d0;
    }

    .auth-link a {
        color: #7c5cff;
        text-decoration: none;
        font-weight: bold;
    }
</style>

<div class="auth-container">
    <div class="auth-card">

        <div class="auth-title">Create Account</div>

        <div class="auth-subtitle">
            Join SkillMap and start your AI career journey.
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="message {% if message.tags == 'success' %}success{% else %}error{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <input
                type="text"
                name="username"
                placeholder="Username"
                class="auth-input"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="Email Address"
                class="auth-input"
                required
            >

            <input
                type="password"
                name="password1"
                placeholder="Password"
                class="auth-input"
                required
            >

            <input
                type="password"
                name="password2"
                placeholder="Confirm Password"
                class="auth-input"
                required
            >

            <button type="submit" class="auth-btn">
                Create Account
            </button>

        </form>

        <div class="auth-link">
            Already have an account?
            <a href="/accounts/login/">Sign In</a>
        </div>

    </div>
</div>

{% endblock %}
