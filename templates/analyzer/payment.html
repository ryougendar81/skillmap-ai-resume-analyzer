{% extends 'base.html' %}

{% block content %}

<style>
    body {
        background: #050816;
        color: white;
        font-family: 'Segoe UI', sans-serif;
    }

    .payment-container {
        max-width: 700px;
        margin: 80px auto;
        background: #111827;
        padding: 50px;
        border-radius: 24px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    h1 {
        text-align: center;
        font-size: 42px;
    }

    .plan {
        text-align: center;
        margin: 20px 0;
        font-size: 22px;
        color: #7c5cff;
    }

    input {
        width: 100%;
        padding: 16px;
        margin: 14px 0;
        border-radius: 12px;
        border: none;
        background: #1f2937;
        color: white;
        font-size: 16px;
    }

    .btn {
        width: 100%;
        padding: 18px;
        background: linear-gradient(135deg, #7c5cff, #5a38ff);
        border: none;
        border-radius: 14px;
        color: white;
        font-size: 18px;
        cursor: pointer;
        margin-top: 20px;
    }

    .success {
        text-align: center;
        margin-top: 20px;
        color: #00d084;
        font-size: 18px;
    }
</style>

<div class="payment-container">
    <h1>Upgrade to SkillMap Pro</h1>

    <div class="plan">
        ₹999/month • Unlimited AI analyses
    </div>

    <form>
        <input type="text" placeholder="Cardholder Name">
        <input type="text" placeholder="Card Number">
        <input type="text" placeholder="Expiry Date (MM/YY)">
        <input type="text" placeholder="CVV">

        <button type="button" class="btn" onclick="showSuccess()">
            Complete Payment
        </button>
    </form>

    <div id="successMessage" class="success" style="display:none;">
        Payment successful! SkillMap Pro activated 🎉
    </div>
</div>

<script>
    function showSuccess() {
        document.getElementById("successMessage").style.display = "block";
    }
</script>

{% endblock %}
